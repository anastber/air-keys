[project]
name = "air-keys"
version = "0.1.0"
description = "Camera-based gesture instrument"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API & Backend — hand tracking, gesture recognition, and audio all run
    # client-side now (see frontend/src/lib). This backend is currently a
    # stub, not wired to any of that.
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",

    # Offline training for the self-trained gesture classifier (see ml/).
    # Own data is collected client-side (same MediaPipe pipeline as
    # inference); these deps only run the offline train/eval pipeline.
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",

    # Offline landmark extraction from public datasets (ml/datasets/):
    # MediaPipe runs the same gesture_recognizer.task model as the frontend,
    # and remotezip reads single images out of the multi-GB HaGRID archives
    # without downloading them. Never used at runtime.
    "mediapipe>=1.1.0",
    "remotezip>=0.12.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.0.280",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

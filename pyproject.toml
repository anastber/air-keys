[project]
name = "air-keys"
version = "0.1.0"
description = "Camera-based gesture instrument using computer vision and ML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Computer Vision
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",

    # Gesture classifier
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",

    # API & Backend
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0.0",

    # Development
    "ruff>=0.0.280",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# X / X_train / X_test etc. are the standard scikit-learn naming convention
# for feature matrices (capitalized because they're 2D, unlike the 1D `y`).
"backend/gesture/classifier.py" = ["N806"]

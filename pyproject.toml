[project]
name = "air-keys"
version = "0.1.0"
description = "Camera-based gesture instrument"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API & Backend — hand tracking, gesture recognition, and audio all run
    # client-side now (see frontend/src/lib). This backend is a stub kept
    # alive for the next layer: an LLM endpoint for instrument reconfiguration.
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",

    # Development
    "ruff>=0.0.280",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

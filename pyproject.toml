[project]
name = "air-keys"
version = "0.1.0"
description = "Camera-based gesture instrument"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API & Backend — hand tracking, gesture recognition, and audio all run
    # client-side now (see frontend/src/lib). This backend is a stub kept
    # alive for the next layer: an LLM endpoint for instrument reconfiguration.
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",

    # Offline training for the self-trained gesture classifier (see ml/).
    # Training data is collected client-side (same MediaPipe pipeline as
    # inference); these deps only run the offline train/eval pipeline, so
    # no mediapipe/opencv webcam-capture deps are needed here.
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",

    # Development
    "ruff>=0.0.280",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
